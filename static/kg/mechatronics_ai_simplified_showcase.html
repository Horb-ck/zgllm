<html lang="zh-CN">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>机电 × 人工智能 双核心知识图谱（动态展示版）</title>
<style>
  :root {
    --panel: rgba(255, 255, 255, 0.76);
    --panel-strong: rgba(255, 255, 255, 0.94);
    --line: rgba(132, 152, 214, 0.18);
    --text: #1f2a44;
    --muted: #6f7e99;
    --mecha: #4bb8c7;
    --ai: #6274ed;
    --course: #f5a524;
    --shadow: 0 22px 54px rgba(73, 97, 153, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 18% 18%, rgba(98, 116, 237, 0.12), transparent 30%),
      radial-gradient(circle at 82% 24%, rgba(75, 184, 199, 0.12), transparent 32%),
      linear-gradient(180deg, #f7f9ff 0%, #eef4ff 100%);
    overflow: hidden;
  }
  .app {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: minmax(720px, 1fr) 360px;
    gap: 16px;
    padding: 18px;
  }
  .stage {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.62);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.82);
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(132,152,214,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(132,152,214,0.07) 1px, transparent 1px);
    background-size: 38px 38px;
    mask-image: radial-gradient(circle at center, black, transparent 84%);
    pointer-events: none;
  }
  .topbar {
    position: absolute;
    z-index: 5;
    top: 20px;
    left: 22px;
    right: 22px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    pointer-events: none;
  }
  .title h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0;
    color: #21304d;
  }
  .title p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    max-width: 620px;
    line-height: 1.6;
  }
  .controls {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  input[type="search"] {
    width: 210px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(132, 152, 214, 0.22);
    outline: none;
    color: var(--text);
    background: rgba(255, 255, 255, 0.78);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.92);
  }
  button {
    border: 1px solid rgba(132, 152, 214, 0.22);
    color: #425172;
    background: rgba(255, 255, 255, 0.78);
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: all .18s ease;
    font-weight: 600;
  }
  button:hover, button.active {
    border-color: rgba(98,116,237,0.28);
    color: #2f52d9;
    background: rgba(235, 240, 255, 0.92);
    transform: translateY(-1px);
  }
  #graph {
    width: 100%;
    height: 100%;
    display: block;
  }
  .link {
    stroke-linecap: round;
    transition: opacity .18s ease, stroke-width .18s ease;
  }
  .node { cursor: pointer; transition: opacity .18s ease; }
  .node circle, .node rect {
    transition: transform .18s ease, filter .18s ease, stroke-width .18s ease;
    transform-box: fill-box;
    transform-origin: center;
  }
  .node:hover circle, .node:hover rect {
    transform: scale(1.06);
    filter: drop-shadow(0 0 14px rgba(255,255,255,0.36));
  }
  .node text {
    fill: #21304d;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    font-weight: 700;
    text-shadow: 0 1px 0 rgba(255,255,255,0.88);
  }
  .course text { font-size: 13px; }
  .pillar text { font-size: 14px; }
  .core text { font-size: 24px; letter-spacing: 0.08em; }
  .dim { opacity: .14; }
  .highlight circle, .highlight rect {
    stroke: #6274ed !important;
    stroke-width: 3px !important;
    filter: drop-shadow(0 10px 18px rgba(98,116,237,0.24));
  }
  .side {
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--panel);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.84);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .side-header {
    padding: 22px 22px 18px;
    border-bottom: 1px solid var(--line);
  }
  .side-header .eyebrow {
    color: #6274ed;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .side-header h2 {
    margin: 10px 0 0;
    font-size: 22px;
    color: #21304d;
  }
  .side-body {
    padding: 20px 22px;
    overflow: auto;
  }
  .course-card {
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .image-wrap { height: 118px; background: linear-gradient(135deg, rgba(75,184,199,.18), rgba(98,116,237,.18)); display:flex; align-items:center; justify-content:center; }
  .image-wrap img { width: 100%; height: 100%; object-fit: cover; opacity: .92; }
  .fallback-img { font-size: 42px; font-weight:900; color:rgba(98,116,237,.28); }
  .card-inner { padding: 16px; }
  .desc { color: #60708f; font-size: 14px; line-height: 1.75; margin: 10px 0 16px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding: 7px 10px; border-radius: 999px; background: rgba(235,240,255,.72); color:#425172; font-size: 12px; border:1px solid rgba(132,152,214,.16); }
  .open-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 14px;
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    text-decoration: none;
    color: #ffffff;
    font-weight: 900;
    background: linear-gradient(135deg, #6274ed, #4bb8c7);
  }
  .open-btn.disabled {
    background: rgba(132,152,214,.16);
    color: #8a96ad;
    cursor: not-allowed;
  }
  .legend {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 18px;
  }
  .legend-item {
    display:flex; align-items:center; gap:8px;
    color:#60708f; font-size:12px;
    padding: 9px 10px; border-radius: 12px;
    background: rgba(235,240,255,.72);
  }
  .dot { width:10px; height:10px; border-radius:999px; display:inline-block; }
  .summary {
    border-radius: 18px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.68);
    border: 1px solid var(--line);
    color: #60708f;
    line-height: 1.7;
    font-size: 13px;
  }
  .stats {
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin: 18px 0;
  }
  .stat {
    background: rgba(235,240,255,.72);
    border: 1px solid rgba(132,152,214,.14);
    padding: 12px 8px;
    border-radius: 16px;
    text-align:center;
  }
  .stats-single {
    grid-template-columns: 1fr;
  }
  .stats-single .stat {
    min-height: 96px;
    display: grid;
    place-items: center;
    align-content: center;
  }
  .stat strong { display:block; font-size: 20px; color:#21304d; }
  .stat span { color:#7d8aa3; font-size:12px; }
  .tooltip {
    position: absolute;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -110%);
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(132,152,214,.18);
    color: #425172;
    font-size: 12px;
    max-width: 260px;
    line-height: 1.5;
    box-shadow: 0 14px 30px rgba(73, 97, 153, 0.16);
  }
  @media (max-width: 1100px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; grid-template-columns: 1fr; }
    .stage { height: 720px; }
    .side { min-height: 420px; }
  }
</style>
</head>

<div class="app">

      </div>
      <div class="controls">
        <input type="search" id="search" placeholder="搜索课程 / 模块" />

      </div>
    </div>
    <div id="graph" role="img" aria-label="机电与人工智能双核心知识图谱"></div>
    <div class="tooltip" id="tooltip"></div>
  </main>

  <aside class="side">

      <h2 id="sideTitle">选择一门课程</h2>
    </div>
    <div class="side-body" id="sideBody"></div>
  </aside>
</div>

function initializeCourseLayout() {
  const grouped = new Map();
  courses.forEach(c => {
    if (!grouped.has(c.pillar)) grouped.set(c.pillar, []);
    grouped.get(c.pillar).push(c);
  });
  const courseAreas = {
    "数理基础": { x1: 300, x2: 700, y1: 38, y2: 156, cols: 3 },
    "控制与机器人": { x1: 60, x2: 360, y1: 150, y2: 400, cols: 2 },
    "工程设计与制造": { x1: 66, x2: 370, y1: 430, y2: 628, cols: 2 },
    "软件与AI系统": { x1: 640, x2: 934, y1: 138, y2: 356, cols: 2 },
    "人机交互与智能感知": { x1: 650, x2: 930, y1: 430, y2: 560, cols: 2 },
    "人文与科技视野": { x1: 382, x2: 618, y1: 584, y2: 640, cols: 2 }
  };
  grouped.forEach((list, pillarName) => {
    const p = pillarByName.get(pillarName);
    const area = courseAreas[pillarName];
    if (area) {
      const cols = Math.min(area.cols, list.length);
      const rows = Math.ceil(list.length / cols);
      const xStep = cols > 1 ? (area.x2 - area.x1) / (cols - 1) : 0;
      const yStep = rows > 1 ? (area.y2 - area.y1) / (rows - 1) : 0;
      list.forEach((c, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const rowShift = row % 2 ? xStep * 0.18 : 0;
        c.x = area.x1 + col * xStep + rowShift;
        c.y = area.y1 + row * yStep;
        c.homeX = c.x;
        c.homeY = c.y;
        c.homeOffsetX = c.x - p.x;
        c.homeOffsetY = c.y - p.y;
      });
      return;
    }
    list.forEach((c, i) => {
      const angle = (Math.PI * 2 * i) / list.length - Math.PI / 2;
      const radius = 122 + (i % 2) * 48;
      const coreBias = (c.ai - c.mecha) * 132;
      c.x = p.x + Math.cos(angle) * radius + coreBias;
      c.y = p.y + Math.sin(angle) * radius + (i % 3 - 1) * 18;
      c.homeX = c.x;
      c.homeY = c.y;
      c.homeOffsetX = Math.cos(angle) * radius + coreBias;
      c.homeOffsetY = Math.sin(angle) * radius + (i % 3 - 1) * 18;
    });
  });
}

function linkColor(kind, course) {

  if (kind === "ai") return `rgba(98, 116, 237, ${0.12 + course.ai * 0.26})`;

}

function makeLinks() {
  const links = [];
  // core bridge
  links.push({ id:"core-bridge", source: cores[0], target: cores[1], color:"rgba(98,116,237,.22)", width: 3, type:"bridge" });
  // pillars to cores
  pillars.forEach(p => {
    const related = courses.filter(c => c.pillar === p.name);
    const avgM = related.reduce((s,c)=>s+c.mecha,0) / Math.max(1, related.length);
    const avgA = related.reduce((s,c)=>s+c.ai,0) / Math.max(1, related.length);
    links.push({ id:`${p.id}-m`, source:p, target:cores[0], color:`rgba(75,184,199,${0.08 + avgM*.20})`, width:1.4+avgM*2, type:"pillar-core" });
    links.push({ id:`${p.id}-a`, source:p, target:cores[1], color:`rgba(98,116,237,${0.08 + avgA*.20})`, width:1.4+avgA*2, type:"pillar-core" });
  });
  // courses to pillar and cores
  courses.forEach(c => {
    const p = pillarByName.get(c.pillar);
    links.push({ id:`${c.id}-p`, source:c, target:p, color:"rgba(245,165,36,.26)", width: 1.6, type:"course-pillar" });
    links.push({ id:`${c.id}-m`, source:c, target:cores[0], color:linkColor("mecha", c), width: 0.8 + c.mecha*2.6, type:"course-core mecha" });
    links.push({ id:`${c.id}-a`, source:c, target:cores[1], color:linkColor("ai", c), width: 0.8 + c.ai*2.6, type:"course-core ai" });
  });
  return links;
}

function roundedLink(a,b,curve=0.16) {
  const mx = (a.x + b.x)/2;
  const my = (a.y + b.y)/2;
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const nx = -dy * curve;
  const ny = dx * curve;
  return `M ${a.x} ${a.y} Q ${mx+nx} ${my+ny} ${b.x} ${b.y}`;
}

function shortName(name) {
  if (name.length <= 8) return [name];
  if (name.length <= 12) return [name.slice(0,6), name.slice(6)];
  return [name.slice(0,6), name.slice(6,12) + (name.length > 12 ? "…" : "")];
}

function nodeFill(d) {
  if (d.type === "core") return d.color;
  if (d.type === "pillar") return "rgba(255, 255, 255, .94)";
  if (d.type === "skill") return "rgba(255, 250, 232, .96)";
  return "rgba(255, 255, 255, .92)";
}
function nodeStroke(d) {
  if (d.type === "core") return "rgba(255,255,255,.9)";
  if (d.type === "pillar") return d.color || "#facc15";
  if (d.type === "skill") return "#f2b84b";
  return "#f5a524";
}

function visibleNode(d) {
  if (mode === "courses") return d.type === "core" || d.type === "course";
  return true;
}
function visibleLink(l) {
  if (mode === "courses") return l.type.includes("course-core") || l.type === "bridge";
  return visibleNode(l.source) && visibleNode(l.target);
}

function shouldShowSkills() {
  return mode !== "courses" && selected && selected.type === "course" && skillNodes.length > 0;
}

function collisionSize(d) {
  if (d.type === "core") return { w: 140, h: 140 };
  if (d.type === "pillar") return { w: 112, h: 86 };
  if (d.type === "course") return { w: 150, h: 76 };
  return { w: 62, h: 48 };
}

function minDistance(a, b) {
  const as = collisionSize(a);
  const bs = collisionSize(b);
  const dx = Math.abs((as.w + bs.w) / 2);
  const dy = Math.abs((as.h + bs.h) / 2);
  return Math.sqrt(dx * dx + dy * dy) * 0.82;
}

  if (d.type === "course") {

    rect.setAttribute("x", -56);

    rect.setAttribute("stroke", nodeStroke(d));
    rect.setAttribute("stroke-width", 1.6);
    g.appendChild(rect);
  } else {
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");

    circle.setAttribute("stroke", nodeStroke(d));
    circle.setAttribute("stroke-width", d.type === "core" ? 2.8 : 2);
    if (d.type === "core") circle.setAttribute("filter", "url(#glow)");
    g.appendChild(circle);
  }

  const lines = d.type === "skill" ? [d.name] : shortName(d.name);
  lines.forEach((line, i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.textContent = line;
    const offset = (i - (lines.length-1)/2) * (d.type === "core" ? 26 : 16);
    t.setAttribute("y", offset);
    t.setAttribute("font-size", d.type === "skill" ? 11 : (d.type === "core" ? 24 : 13));
    if (d.type === "skill") t.setAttribute("fill", "#6b5b2e");

  });
  layer.appendChild(g);
}

function updateSvgPositions() {
  const activeLinks = [...makeLinks().filter(visibleLink), ...(shouldShowSkills() ? skillLinks : [])];
  document.querySelectorAll(".link").forEach(path => {
    const link = activeLinks.find(l => l.id === path.getAttribute("data-link-id"));
    if (!link) return;
    path.setAttribute("d", roundedLink(link.source, link.target, link.type === "skill" ? 0.04 : 0.10));
  });
  document.querySelectorAll(".node").forEach(el => {
    const d = byId.get(el.getAttribute("data-id")) || skillNodes.find(s => s.id === el.getAttribute("data-id"));
    if (!d) return;
    el.setAttribute("transform", `translate(${d.x},${d.y})`);
  });
}

function applyForces() {
  frame += 1;
  cores.forEach(c => {
    c.x = c.fx;
    c.y = c.fy;
    c.vx = 0;
    c.vy = 0;
  });

  const movable = nodes.filter(n => n.type !== "core");
  movable.forEach(d => {
    let targetX = d.x;
    let targetY = d.y;
    if (d.type === "pillar") {
      targetX = d.anchorX + Math.sin(frame / 140 + d.anchorY) * 5;
      targetY = d.anchorY + Math.cos(frame / 160 + d.anchorX) * 4;
    } else if (d.type === "course") {
      targetX = d.homeX + Math.sin(frame / 110 + d.id.length) * 5;
      targetY = d.homeY + Math.cos(frame / 130 + d.id.length) * 4;
    }
    d.vx += (targetX - d.x) * (d.type === "pillar" ? 0.012 : 0.009);
    d.vy += (targetY - d.y) * (d.type === "pillar" ? 0.012 : 0.009);
  });

  const repelNodes = nodes.filter(visibleNode);
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < repelNodes.length; i++) {
      for (let j = i + 1; j < repelNodes.length; j++) {
        const a = repelNodes[i];
        const b = repelNodes[j];
        if (a.type === "core" && b.type === "core") continue;
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const target = minDistance(a, b);
        if (dist < target) {
          const push = (target - dist) * 0.028;
          dx /= dist;
          dy /= dist;
          if (a.type !== "core") {
            a.vx -= dx * push;
            a.vy -= dy * push;
          }
          if (b.type !== "core") {
            b.vx += dx * push;
            b.vy += dy * push;
          }
        }
      }
    }
  }

  movable.forEach(d => {
    d.vx *= 0.86;
    d.vy *= 0.86;
    d.x += d.vx;
    d.y += d.vy;
    d.x = Math.max(52, Math.min(948, d.x));
    d.y = Math.max(52, Math.min(642, d.y));
  });

  if (shouldShowSkills()) {
    const course = skillNodes[0].parentCourse;
    const count = skillNodes.length;
    skillNodes.forEach((s, i) => {
      const angle = (-90 + (360 / count) * i + Math.sin(frame / 90) * 6) * Math.PI / 180;
      const radius = 76;
      s.x = course.x + Math.cos(angle) * radius;
      s.y = course.y + Math.sin(angle) * radius;
    });
  }
}

function settleLayout(iterations = 90) {
  for (let i = 0; i < iterations; i++) {
    applyForces();
  }
}

function startMotion() {
  if (animationStarted) return;
  animationStarted = true;
  const tick = () => {
    applyForces();
    updateEchartsPositions();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function selectNode(d) {
  if (d.type === "skill") {
    selected = d.parentCourse;
    renderSideCourse(d.parentCourse);
    renderEchartsGraph();
    return;
  }

  if (selected && selected.id === d.id) {
    selected = null;
    skillNodes = [];
    skillLinks = [];
    renderSideDefault();
    renderEchartsGraph();
    return;
  }

  selected = d;
  if (d.type === "course") {
    buildSkillNodes(d);
    renderSideCourse(d);
  } else if (d.type === "pillar") {
    skillNodes = [];
    skillLinks = [];
    renderSidePillar(d);
  } else if (d.type === "core") {
    skillNodes = [];
    skillLinks = [];
    renderSideCore(d);
  }
  renderEchartsGraph();
}

function buildSkillNodes(course) {
  skillNodes = [];
  skillLinks = [];
  const count = course.tags.length;
  const radius = 76;
  const start = -90;
  course.tags.forEach((tag, i) => {
    const angle = (start + (360 / count) * i) * Math.PI / 180;
    const s = {
      id: `skill-${course.id}-${i}`,
      name: tag,
      type: "skill",
      x: course.x + Math.cos(angle) * radius,
      y: course.y + Math.sin(angle) * radius,
      r: 19,
      color: "#fbbf24",
      parentCourse: course,
      desc: `《${course.name}》能力点：${tag}`
    };
    skillNodes.push(s);
    skillLinks.push({ id: `${course.id}-skill-${i}`, source: course, target: s, color: "rgba(245,165,36,.34)", width: 1.3, type:"skill" });
  });
}

function relatedIds(d) {
  if (!d) return new Set();
  const ids = new Set([d.id]);
  if (d.type === "course") {
    ids.add("core-mecha"); ids.add("core-ai");
    const p = pillarByName.get(d.pillar); if (p) ids.add(p.id);
    skillNodes.forEach(s => ids.add(s.id));
  } else if (d.type === "pillar") {
    ids.add("core-mecha"); ids.add("core-ai");
    courses.filter(c => c.pillar === d.name).forEach(c => ids.add(c.id));
  } else if (d.type === "core") {
    nodes.forEach(n => ids.add(n.id));
  } else if (d.type === "skill") {
    ids.add(d.parentCourse.id);
  }
  return ids;
}

function updateHighlights() {
  const ids = relatedIds(selected);
  document.querySelectorAll(".node").forEach(el => {
    const id = el.getAttribute("data-id");
    el.classList.remove("highlight", "dim");
    if (selected && !ids.has(id)) el.classList.add("dim");
    if (selected && ids.has(id)) el.classList.add("highlight");
  });
  document.querySelectorAll(".link").forEach(el => {
    const s = el.getAttribute("data-source"), t = el.getAttribute("data-target");
    if (selected && !(ids.has(s) && ids.has(t))) el.classList.add("dim");
    else el.classList.remove("dim");
  });
}

function showTooltip(evt, d) {
  tooltip.style.opacity = 1;
  tooltip.innerHTML = `<b>${d.name}</b><br>${d.desc || d.description || d.pillar || ""}`;
  moveTooltip(evt);
}
function moveTooltip(evt) {
  const r = stage.getBoundingClientRect();
  tooltip.style.left = `${evt.clientX - r.left}px`;
  tooltip.style.top = `${evt.clientY - r.top}px`;
}
function hideTooltip() { tooltip.style.opacity = 0; }

function renderSideDefault() {
  sideTitle.textContent = "选择一门课程";
  sideBody.innerHTML = `
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#2dd4bf"></span>机电核心</div>
      <div class="legend-item"><span class="dot" style="background:#818cf8"></span>人工智能核心</div>
      <div class="legend-item"><span class="dot" style="background:#facc15"></span>课程节点</div>
      <div class="legend-item"><span class="dot" style="background:#fbbf24"></span>能力点展开</div>
    </div>
    <div class="stats">
      <div class="stat"><strong>2</strong><span>核心</span></div>
      <div class="stat"><strong>${courses.length}</strong><span>课程</span></div>
      <div class="stat"><strong>${pillars.length}</strong><span>能力模块</span></div>
    </div>
    <div class="summary">
      重庆大学卓越工程师学院围绕“AI+机电”构建课程体系，强调学科交叉、项目牵引与产教协同，让学生在真实工程问题中建立从原理学习到系统设计、产品实现的完整能力链。<br><br>
      <b>课程构成：</b>图谱以机电与人工智能为双核心，串联数理基础、控制与机器人、工程设计与制造、软件与AI系统、人机交互与智能感知、人文与科技视野等模块。点击课程节点，可查看课程简介、关键词，并进入对应课程智能体。
    </div>`;
}

function renderSideCourse(c) {
  sideTitle.textContent = c.name;
  sideBody.innerHTML = `
    <div class="course-card">
      <div class="image-wrap">
        <img src="${c.image_url}" alt="${c.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <div class="fallback-img" style="display:none;">${c.name.slice(0,1)}</div>
      </div>
      <div class="card-inner">
        <div class="chip">${c.pillar}</div>
        <p class="desc">${c.description}</p>
        <div class="chips">${c.tags.map(t => `<span class="chip">${t}</span>`).join("")}</div>
        ${c.url ? `<a class="open-btn" href="${c.url}" target="_top">进入课程智能体</a>` : `<span class="open-btn disabled">暂无课程链接</span>`}
      </div>
    </div>
  `;
}
function renderSidePillar(p) {
  const list = courses.filter(c => c.pillar === p.name);
  const detail = pillarDetails[p.name];
  sideTitle.textContent = p.name;
  sideBody.innerHTML = `
    <div class="summary">
      <b>模块定位：</b>${detail ? detail.role : p.description}<br><br>
      <b>覆盖内容：</b>${detail ? detail.coverage : p.description}<br><br>
      <b>培养目标：</b>${detail ? detail.goal : "帮助学生建立该方向的课程理解和工程实践能力。"}
    </div>
    <div class="stats stats-single"><div class="stat"><strong>${list.length}</strong><span>课程</span></div></div>
    <div class="chips">${list.map(c => `<span class="chip" onclick="selectNode(byName.get('${c.name}'))">${c.name}</span>`).join("")}</div>
  `;
}
function renderSideCore(d) {
  sideTitle.textContent = d.name;
  const sorted = [...courses].sort((a,b) => d.name === "机电" ? b.mecha-a.mecha : b.ai-a.ai).slice(0,8);
  sideBody.innerHTML = `
    <div class="summary">${d.desc}</div>
    <div class="course-card"><div class="card-inner"><b>相关度最高的课程</b><div class="chips" style="margin-top:12px;">${sorted.map(c => `<span class="chip" onclick="selectNode(byName.get('${c.name}'))">${c.name}</span>`).join("")}</div></div></div>
  `;
}

function echartsNode(d) {
  const isCore = d.type === "core";
  const isPillar = d.type === "pillar";
  const isSkill = d.type === "skill";
  const isCourse = d.type === "course";
  const itemColor = isCore
    ? (d.name === "机电" ? "#4bb8c7" : "#6274ed")
    : isPillar
      ? "#ffffff"
      : isSkill
        ? "#fff7dc"
        : "#ffffff";
  const borderColor = isCore
    ? "#ffffff"
    : isPillar
      ? d.color
      : isSkill
        ? "#f5a524"
        : "#f5a524";

  return {
    id: d.id,
    name: d.name,
    value: isCore ? 100 : isPillar ? 70 : isCourse ? 48 : 24,
    category: isCore ? 0 : isPillar ? 1 : isCourse ? 2 : 3,
    x: d.x,
    y: d.y,
    fixed: isCore,
    draggable: !isCore,
    symbol: isCourse ? "roundRect" : "circle",
    symbolSize: isCore ? 118 : isPillar ? 74 : isSkill ? 34 : [110, 48],
    rawNode: d,
    label: {
      show: true,
      color: isCore ? "#ffffff" : "#24314d",
      fontWeight: 700,
      fontSize: isCore ? 22 : isPillar ? 13 : isSkill ? 11 : 12,
      lineHeight: 15,
      formatter: function (params) {
        return shortName(params.name).join("\n");
      }
    },
    itemStyle: {
      color: itemColor,
      borderColor: borderColor,
      borderWidth: isCore ? 3 : 1.8,
      shadowBlur: isCore ? 28 : isPillar ? 16 : 12,
      shadowColor: isCore
        ? (d.name === "机电" ? "rgba(75,184,199,.38)" : "rgba(98,116,237,.36)")
        : "rgba(73,97,153,.16)"
    },
    emphasis: {
      scale: true,
      itemStyle: {
        borderWidth: 3,
        shadowBlur: 32,
        shadowColor: "rgba(98,116,237,.32)"
      },
      label: {
        fontSize: isCore ? 24 : 14
      }
    }
  };
}

function echartsLinks() {
  return [...makeLinks().filter(visibleLink), ...(shouldShowSkills() ? skillLinks : [])].map(l => ({
    source: l.source.id,
    target: l.target.id,
    value: l.type,
    lineStyle: {
      color: l.color || "rgba(132,152,214,.22)",
      width: l.width || 1.4,
      curveness: l.type === "skill" ? 0.06 : 0.12,
      opacity: l.type === "bridge" ? 0.55 : 0.42
    },
    emphasis: {
      lineStyle: {
        opacity: 0.9,
        width: Math.max(2.2, (l.width || 1.4) + 1)
      }
    }
  }));
}

function graphNodes() {
  return [...nodes.filter(visibleNode), ...(shouldShowSkills() ? skillNodes : [])];
}

function buildEchartsData() {
  const related = relatedIds(selected);
  return graphNodes().map(d => {
    const node = echartsNode(d);
    if (selected && !related.has(d.id)) {
      node.itemStyle.opacity = 0.22;
      node.label.opacity = 0.28;
    }
    if (selected && related.has(d.id)) {
      node.itemStyle.borderWidth = d.type === "core" ? 3.4 : 2.8;
      node.itemStyle.shadowBlur = d.type === "core" ? 34 : 24;
      node.itemStyle.shadowColor = "rgba(98,116,237,.34)";
    }
    return node;
  });
}

function updateEchartsPositions() {
  if (!kgChart) return;
  kgChart.setOption({
    series: [{
      data: buildEchartsData(),
      links: echartsLinks()
    }]
  }, false, true);
}

function renderEchartsGraph() {
  if (!window.echarts || !chartDom) return;
  if (!kgChart) {
    kgChart = echarts.init(chartDom, null, { renderer: "canvas" });
    kgChart.on("click", params => {
      if (params.dataType === "node" && params.data && params.data.rawNode) {
        selectNode(params.data.rawNode);
      }
    });
    kgChart.getZr().on("click", event => {
      if (!event.target) {
        selected = null;
        skillNodes = [];
        skillLinks = [];
        renderSideDefault();
        renderEchartsGraph();
      }
    });
    window.addEventListener("resize", () => kgChart && kgChart.resize());
  }

  if (!layoutSettled) {
    settleLayout(70);
    layoutSettled = true;
  }

  kgChart.dispatchAction({ type: "downplay", seriesIndex: 0 });

  kgChart.setOption({
    backgroundColor: "transparent",
    animationDuration: 900,
    animationEasingUpdate: "cubicOut",
    tooltip: {
      trigger: "item",
      confine: true,
      backgroundColor: "rgba(255,255,255,.96)",
      borderColor: "rgba(132,152,214,.18)",
      borderWidth: 1,
      textStyle: { color: "#425172" },
      extraCssText: "box-shadow:0 14px 30px rgba(73,97,153,.16);border-radius:12px;",
      formatter: function (params) {
        if (params.dataType === "edge") return "";
        const d = params.data.rawNode;
        return `<b>${d.name}</b><br>${d.desc || d.description || d.pillar || ""}`;
      }
    },
    series: [{
      type: "graph",
      layout: "none",
      roam: true,
      draggable: false,
      selectedMode: false,
      focusNodeAdjacency: false,
      scaleLimit: {
        min: 0.72,
        max: 2.4
      },
      edgeSymbol: ["none", "none"],
      categories: [
        { name: "核心" },
        { name: "能力模块" },
        { name: "课程" },
        { name: "能力点" }
      ],
      data: buildEchartsData(),
      links: echartsLinks(),
      label: { position: "inside" },
      lineStyle: {
        cap: "round"
      },
      emphasis: {
        focus: "none"
      }
    }]
  }, true);

  startMotion();
}

function setMode(next) {
  mode = next;
  if (mode === "courses") {
    skillNodes = [];
    skillLinks = [];
  }
  document.getElementById("btnCourses").classList.toggle("active", mode === "courses");
  document.getElementById("btnCourses").textContent = mode === "courses" ? "显示类别" : "只看课程";
  renderEchartsGraph();
}

document.getElementById("btnCourses").addEventListener("click", () => setMode(mode === "courses" ? "all" : "courses"));

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { selected = null; skillNodes=[]; skillLinks=[]; renderSideDefault(); renderEchartsGraph(); return; }
  const found = nodes.find(n => n.name.toLowerCase().includes(q));
  if (found) selectNode(found);
});

renderSideDefault();
renderEchartsGraph();
</script>
</body>
</html>
