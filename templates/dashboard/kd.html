{% extends "layout.html" %}

{% block title %}课程智能体 - 明月科创教育大模型{% endblock %}

{% block content %}
<div class="spark-dashboard-page">
    {% include "dashboard/_spark_topbar.html" %}
    <main class="spark-dashboard-main">
        <div class="dashboard-container">
    <!-- 主内容区域 -->
    <div class="main-content">
        <div class="page-header">
            <h1>智能体广场</h1>
            <p>探索竞赛智能体，快速进入专属对话</p>
        </div>

        <div class="agents-grid">
            {% for agent in agents %}
            <div class="agent-card">
                <div class="agent-image">
                    <img src="{{ agent.image_url }}" alt="{{ agent.name }}" class="ags">
                </div>
                <div class="agent-content">
                    <h3>{{ agent.name }}</h3>
                    <p>{{ agent.description }}</p>
                    <div class="agent-actions">
                        <a href="{{ url_for('app_comp.view_kd', agent_id=agent.id) }}" class="btn btn-primary">打开对话</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

    </div>
</div>
    </main>
</div>
{% endblock %}
