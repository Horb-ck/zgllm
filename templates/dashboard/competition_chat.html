{% extends "layout.html" %}

{% block title %}{{ agent.name }} - 明月科创教育大模型{% endblock %}

{% block content %}
<div class="spark-dashboard-page">
    {% include "dashboard/_spark_topbar.html" %}
    <main class="spark-dashboard-main">
        <div class="dashboard-container">
    <div class="main-content robocon-page">
        <div class="robocon-layout" id="robocon-layout" data-layout="list-chat">
            <section class="rules-panel" id="rules-panel">
                <div class="panel-header">
                    <div class="panel-header-main">
                        <div class="panel-header-top">
                            <span class="panel-tag">官方规则</span>
                        </div>
                        <h2>{{ resource_panel_title }}</h2>
                    </div>
                </div>

                <div class="resource-switcher" id="resource-switcher"></div>

                <div class="resource-meta">
                    <div>
                        <span class="meta-label">资料来源</span>
                        <a id="resource-official-link" href="#" target="_blank" rel="noopener">官网入口</a>
                    </div>
                    <div>
                        <span class="meta-label">最近更新</span>
                        <strong id="resource-updated-at"></strong>
                    </div>
                </div>

                <div class="resource-list" id="resource-list"></div>
                <p class="resource-sync-time" id="resource-sync-time"></p>
            </section>

            <section class="pdf-panel" id="pdf-panel" hidden>
                <div class="pdf-panel-header">
                    <div class="pdf-header-copy">
                        <span class="meta-label">当前资料</span>
                        <h3 id="preview-title"></h3>
                        <p id="preview-subtitle"></p>
                    </div>
                    <div class="pdf-actions">
                        <button type="button" class="panel-action-btn secondary" id="back-to-list-btn">返回对话</button>
                        <a class="preview-link" id="preview-link" href="#" target="_blank" rel="noopener">打开原文</a>
                    </div>
                </div>
                <iframe id="rules-preview" title="规则预览" loading="lazy"></iframe>
                <p class="preview-tip">如果预览区域空白，通常是官网禁止嵌入；这时点击“打开原文”即可。返回会恢复成规则标题列表视图。</p>
            </section>

            <section class="chat-panel" id="chat-panel">
                <div class="chat-shell">
                    <iframe
                        src="{{ embed_url }}"
                        frameborder="0"
                        allow="microphone; camera"
                        allowfullscreen
                        loading="lazy"
                        id="chat-iframe"
                    ></iframe>
                </div>
            </section>
        </div>
    </div>
</div>
    </main>
</div>

<style>
.robocon-page {
    flex: 1;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at top left, rgba(21, 101, 192, 0.08), transparent 28%),
        linear-gradient(180deg, #f7fbff 0%, #eef4f7 100%);
    padding-top: 4px;
}

.spark-dashboard-page {
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
}

.spark-dashboard-page .spark-dashboard-main {
    height: calc(100vh - 84px);
    padding: 12px 0;
    overflow: hidden;
}

.spark-dashboard-page > .spark-dashboard-main > .dashboard-container,
.spark-dashboard-page .main-content.robocon-page {
    height: 100%;
    min-height: 0;
    overflow: hidden;
}

.spark-dashboard-page .main-content.robocon-page {
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
}

.robocon-layout {
    display: grid;
    grid-template-columns: clamp(760px, 48vw, 840px) minmax(0, 1fr);
    gap: 20px;
    height: 100%;
    min-height: 0;
    padding: 0 24px 8px;
    box-sizing: border-box;
    align-items: stretch;
    position: relative;
    overflow: hidden;
}

.rules-panel,
.chat-panel,
.pdf-panel {
    min-height: 0;
    height: 100%;
}

.rules-panel[hidden],
.pdf-panel[hidden],
.chat-panel[hidden] {
    display: none !important;
}

.rules-panel,
.pdf-panel,
.chat-shell {
    border: 1px solid rgba(15, 23, 42, 0.08);
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
}

.rules-panel,
.pdf-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 24px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(246, 249, 252, 0.94));
    overflow: hidden;
}

.panel-header,
.pdf-panel-header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
}

.panel-header-main {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
    width: 100%;
}

.panel-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.panel-header h2 {
    margin: 0;
    font-size: 24px;
    color: #0f172a;
    line-height: 1.2;
    word-break: keep-all;
}

.panel-tag {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
}

.panel-tag.neutral {
    background: #e2e8f0;
    color: #334155;
}

.resource-switcher {
    display: inline-flex;
    gap: 10px;
    flex-wrap: wrap;
}

.switch-btn {
    padding: 10px 16px;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #ffffff;
    color: #334155;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.switch-btn.active {
    border-color: #1d4ed8;
    background: #1d4ed8;
    color: #ffffff;
    box-shadow: 0 10px 20px rgba(29, 78, 216, 0.18);
}

.panel-action-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    min-height: 32px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.panel-action-btn:hover,
.preview-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 20px rgba(37, 99, 235, 0.12);
}

.panel-action-btn.secondary {
    background: #ffffff;
    color: #334155;
    border-color: rgba(148, 163, 184, 0.28);
}

.resource-meta {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.resource-meta > div {
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
}

.meta-label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    color: #64748b;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.resource-meta a,
.resource-meta strong {
    color: #0f172a;
    font-size: 15px;
}

.resource-list {
    display: grid;
    flex: 1 1 auto;
    grid-auto-rows: max-content;
    gap: 12px;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    padding-right: 8px;
    scrollbar-gutter: stable;
    align-content: start;
}

.resource-sync-time {
    margin: 0;
    font-size: 12px;
    line-height: 1.4;
    color: #64748b;
}

.resource-list::-webkit-scrollbar {
    width: 8px;
}

.resource-list::-webkit-scrollbar-track {
    background: rgba(226, 232, 240, 0.7);
    border-radius: 999px;
}

.resource-list::-webkit-scrollbar-thumb {
    background: rgba(59, 130, 246, 0.45);
    border-radius: 999px;
}

.resource-list::-webkit-scrollbar-thumb:hover {
    background: rgba(37, 99, 235, 0.65);
}

.resource-item {
    text-align: left;
    padding: 16px;
    border-radius: 18px;
    background: #ffffff;
    border: 1px solid rgba(148, 163, 184, 0.22);
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}

.resource-item:hover {
    transform: translateY(-1px);
    border-color: rgba(37, 99, 235, 0.35);
}

.resource-item.active {
    border-color: #2563eb;
    box-shadow: 0 12px 24px rgba(37, 99, 235, 0.12);
}

.resource-item-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
}

.resource-item h3 {
    margin: 0;
    font-size: 16px;
    color: #0f172a;
    line-height: 1.5;
}

.doc-badge {
    flex-shrink: 0;
    padding: 4px 10px;
    border-radius: 999px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 12px;
    font-weight: 700;
}

.resource-item-footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-top: 10px;
    color: #64748b;
    font-size: 13px;
}

.pdf-panel {
    overflow: hidden;
}

.pdf-panel-header {
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.18);
}

.pdf-header-copy h3 {
    margin: 4px 0 8px;
    font-size: 22px;
    color: #0f172a;
}

.pdf-header-copy p {
    margin: 0;
    color: #64748b;
    line-height: 1.6;
}

.pdf-actions {
    display: flex;
    flex-wrap: nowrap;
    gap: 12px;
    align-items: center;
    justify-content: flex-end;
}

.preview-link {
    display: inline-flex;
    align-items: center;
    padding: 8px 12px;
    border-radius: 10px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
}

#rules-preview {
    width: 100%;
    flex: 1 1 auto;
    min-height: 640px;
    border: 0;
    background: #f8fafc;
    border-radius: 18px;
}

.preview-tip {
    margin: 0;
    color: #64748b;
    font-size: 13px;
    line-height: 1.6;
}

.chat-panel {
    min-height: 0;
}

.chat-shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    border-radius: 24px;
    background: #ffffff;
}

#chat-iframe {
    width: 100%;
    height: 100%;
    flex: 1 1 auto;
    border: 0;
    display: block;
}

.robocon-layout[data-layout="list-chat"],
.robocon-layout[data-layout="list-pdf"] {
    grid-template-columns: 400px minmax(0, 1fr);
}

@media (max-width: 1100px) {
    .spark-dashboard-page {
        height: auto;
        min-height: 100vh;
        overflow: auto;
    }

    .spark-dashboard-page .spark-dashboard-main {
        height: auto;
        overflow: visible;
    }

    .spark-dashboard-page > .spark-dashboard-main > .dashboard-container,
    .spark-dashboard-page .main-content.robocon-page {
        height: auto;
        overflow: visible;
    }

    .robocon-layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: auto;
        overflow: visible;
        padding-bottom: 12px;
    }

    .resource-meta {
        grid-template-columns: 1fr;
    }

    .robocon-layout[data-layout="list-chat"],
    .robocon-layout[data-layout="list-pdf"] {
        grid-template-columns: 1fr;
    }

    .rules-panel,
    .pdf-panel,
    .chat-panel {
        order: 2;
    }

    .chat-shell,
    .pdf-panel {
        min-height: 700px;
    }

    #rules-preview {
        min-height: 520px;
    }
}

@media (max-width: 768px) {
    .robocon-layout {
        padding: 0 16px 12px;
        gap: 16px;
    }

    .rules-panel {
        padding: 18px;
        border-radius: 20px;
    }

    .pdf-panel {
        padding: 18px;
        border-radius: 20px;
    }

    .chat-shell {
        min-height: 620px;
        border-radius: 20px;
    }

    .panel-header h2 {
        font-size: 24px;
    }

    .panel-header,
    .pdf-panel-header {
        flex-direction: column;
    }

    .panel-header-top {
        width: 100%;
    }

    .pdf-actions {
        width: 100%;
    }

    .panel-action-btn,
    .preview-link {
        justify-content: center;
    }

    #rules-preview {
        min-height: 420px;
    }
}
</style>

<script>
const competitionResources = {{ competition_resources|tojson }};
const configuredDefaultCategory = {{ default_category|tojson }};
const defaultCategory = competitionResources[configuredDefaultCategory]
    ? configuredDefaultCategory
    : (Object.keys(competitionResources)[0] || "");

const state = {
    category: defaultCategory,
    activeDocIndex: null
};

const layoutEl = document.getElementById("robocon-layout");
const rulesPanelEl = document.getElementById("rules-panel");
const pdfPanelEl = document.getElementById("pdf-panel");
const chatPanelEl = document.getElementById("chat-panel");
const switcherEl = document.getElementById("resource-switcher");
const officialLinkEl = document.getElementById("resource-official-link");
const updatedAtEl = document.getElementById("resource-updated-at");
const listEl = document.getElementById("resource-list");
const syncTimeEl = document.getElementById("resource-sync-time");
const previewTitleEl = document.getElementById("preview-title");
const previewSubtitleEl = document.getElementById("preview-subtitle");
const previewLinkEl = document.getElementById("preview-link");
const previewFrameEl = document.getElementById("rules-preview");
const backToListBtnEl = document.getElementById("back-to-list-btn");

function getSection() {
    return competitionResources[state.category] || competitionResources[defaultCategory] || { docs: [] };
}

function getDoc() {
    if (state.activeDocIndex === null) {
        return null;
    }

    return getSection().docs[state.activeDocIndex] || null;
}

function openDoc(index) {
    state.activeDocIndex = index;
    render();
}

function showRulesList() {
    state.activeDocIndex = null;
    render();
}

function setCategory(categoryKey) {
    state.category = categoryKey;
    state.activeDocIndex = null;
    render();
}

function renderSwitcher() {
    switcherEl.innerHTML = "";
    Object.values(competitionResources).forEach((section) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `switch-btn${state.category === section.key ? " active" : ""}`;
        button.textContent = section.label;
        button.addEventListener("click", () => setCategory(section.key));
        switcherEl.appendChild(button);
    });
}

function renderList(section) {
    listEl.innerHTML = "";
    section.docs.forEach((doc, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = `resource-item${state.activeDocIndex === index ? " active" : ""}`;
        item.innerHTML = `
            <div class="resource-item-head">
                <h3>${doc.title}</h3>
                <span class="doc-badge">${doc.type}</span>
            </div>
            <div class="resource-item-footer">
                <span>${doc.date}</span>
                <span>${doc.source}</span>
            </div>
        `;
        item.addEventListener("click", () => openDoc(index));
        listEl.appendChild(item);
    });
}

function renderPreview(doc) {
    if (!doc) {
        previewTitleEl.textContent = "";
        previewSubtitleEl.textContent = "";
        previewLinkEl.href = "#";
        previewFrameEl.removeAttribute("src");
        return;
    }

    previewTitleEl.textContent = doc.title;
    previewSubtitleEl.textContent = `${doc.type} · ${doc.date} · ${doc.source}`;
    previewLinkEl.href = doc.url;
    previewFrameEl.src = doc.preview_url;
}

function renderLayout() {
    const hasActiveDoc = state.activeDocIndex !== null;

    if (hasActiveDoc) {
        layoutEl.dataset.layout = "list-pdf";
        rulesPanelEl.hidden = false;
        pdfPanelEl.hidden = false;
        chatPanelEl.hidden = true;
        return;
    }

    layoutEl.dataset.layout = "list-chat";
    rulesPanelEl.hidden = false;
    pdfPanelEl.hidden = true;
    chatPanelEl.hidden = false;
}

function render() {
    const section = getSection();
    const doc = getDoc();
    renderSwitcher();
    officialLinkEl.href = section.official_url;
    officialLinkEl.textContent = {{ official_link_label|tojson }};
    updatedAtEl.textContent = section.updated_at;
    syncTimeEl.textContent = `最近同步时间：${section.synced_at || section.updated_at || ""}`;
    renderList(section);
    renderPreview(doc);
    renderLayout();
}

backToListBtnEl.addEventListener("click", showRulesList);

render();
</script>
{% endblock %}
